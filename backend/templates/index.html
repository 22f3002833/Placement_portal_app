<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        :root {
            --brand-primary: #0d6efd;
            --brand-dark: #0f172a;
            --brand-surface: #ffffff;
            --brand-border: #e5e7eb;
            --brand-muted: #6b7280;
            --brand-bg: #f8fafc;
            --brand-accent: #eff6ff;
        }

        html, body {
            min-height: 100%;
        }

        body {
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            color: #111827;
        }

        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            z-index: 2000;
            background: #111827;
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 0 0 0.5rem 0.5rem;
        }

        .skip-link:focus {
            left: 1rem;
            top: 0;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.22);
        }

        .hero-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .auth-card {
            max-width: 1080px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 1.5rem;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
        }

        .auth-panel {
            padding: 2.5rem;
            height: 100%;
        }

        .auth-side {
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.16), transparent 30%),
                linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            min-height: 100%;
        }

        .auth-side .feature-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 1rem;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.06);
        }

        .dashboard-shell {
            min-height: 100vh;
            background: var(--brand-bg);
        }

        .topbar {
            border-bottom: 1px solid var(--brand-border);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
        }

        .sidebar-card {
            border: 1px solid var(--brand-border);
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.8rem 1rem;
            color: #334155;
            text-decoration: none;
            border-radius: 0.85rem;
            transition: 0.2s ease;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .stat-card {
            border: 1px solid var(--brand-border);
            border-radius: 1rem;
            background: #fff;
            padding: 1.25rem;
            height: 100%;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--brand-muted);
        }

        .stat-value {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .section-card {
            border: 1px solid var(--brand-border);
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        .table thead th {
            font-size: 0.88rem;
            color: #475569;
            font-weight: 600;
            white-space: nowrap;
        }

        .empty-state {
            border: 1px dashed #cbd5e1;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            color: #64748b;
            background: #f8fafc;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .soft-badge {
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .resume-chip {
            font-size: 0.85rem;
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            background: #ecfdf5;
            color: #047857;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .app-shell-loader {
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        @media (max-width: 991.98px) {
            .auth-panel {
                padding: 1.5rem;
            }

            .hero-shell {
                align-items: stretch;
                padding: 1rem 0;
            }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div id="app">
        <div class="app-shell-loader">
            <div class="text-center">
                <div class="brand-mark mx-auto mb-3">PP</div>
                <h1 class="h3 mb-2">Placement Portal</h1>
                <p class="text-muted mb-0">Loading application...</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/router.js') }}"></script>

    <script src="{{ url_for('static', filename='js/components/login.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/register.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/admin_dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/company_dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/student_dashboard.js') }}"></script>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
